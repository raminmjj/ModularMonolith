# Secrets are REQUIRED — copy .env.example to .env and fill in real values.
# docker compose auto-loads .env. Missing values fail fast via ${VAR:?error}.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: modular-monolith-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required (see .env.example)}"
      MSSQL_PID: "Developer"
    ports: ["1433:1433"]
    volumes: [sqlserver_data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Init container: applies EF Core migrations, then exits.
  # The API never auto-migrates on startup (production safety).
  migrations:
    build: { context: ., dockerfile: Dockerfile }
    container_name: modular-monolith-migrations
    depends_on: { sqlserver: { condition: service_healthy } }
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Identity: "Server=sqlserver,1433;Database=ModularMonolith_Identity;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      ConnectionStrings__Catalog: "Server=sqlserver,1433;Database=ModularMonolith_Catalog;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      ConnectionStrings__Orders: "Server=sqlserver,1433;Database=ModularMonolith_Orders;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
    command: ["dotnet", "ModularMonolith.Host.dll", "--migrate"]
    restart: "no"

  api:
    build: { context: ., dockerfile: Dockerfile }
    container_name: modular-monolith-api
    depends_on:
      sqlserver: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      JWT__SIGNINGKEY: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required (openssl rand -base64 48) (see .env.example)}"
      ConnectionStrings__Identity: "Server=sqlserver,1433;Database=ModularMonolith_Identity;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      ConnectionStrings__Catalog: "Server=sqlserver,1433;Database=ModularMonolith_Catalog;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      ConnectionStrings__Orders: "Server=sqlserver,1433;Database=ModularMonolith_Orders;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      Jwt__Issuer: "ModularMonolith"
      Jwt__Audience: "ModularMonolith.Clients"
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  sqlserver_data: { driver: local }
